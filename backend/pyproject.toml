[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syniti-orchestrator"
version = "0.1.0"
description = "MDM Syniti Analysis Orchestrator API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "cachetools>=5.3.0",
    "sqlglot==30.11.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "openai-agents>=0.24.0",
    "openai>=1.50.0",
    "tenacity>=9.0.0",
    "pdfplumber>=0.11.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    "numpy<2.0.0",
    "filelock>=3.12.0",
    "openpyxl>=3.1.2",
    "structlog>=24.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:tarfile:",
]


