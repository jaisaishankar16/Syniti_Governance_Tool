name: CI Pipeline

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-and-test:
    name: Backend Validation (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest pytest-asyncio fakeredis tiktoken

      - name: Run Ruff Lint Check
        run: ruff check backend

      - name: Run Ruff Format Check
        run: ruff format --check backend

      - name: Run Mypy Typecheck
        run: mypy backend/app

      - name: Run Pytest (Offline Unit & Contract Suites)
        env:
          OPENAI_API_KEY: "sk-proj-ciPipelinePlaceholderKey1234567890"
          LLM_MODEL: "gpt-4o-mini"
          PYTHONPATH: "backend"
        run: pytest backend/tests -v --ignore=backend/tests/test_agents_live_smoke.py

  frontend-lint-and-test:
    name: Frontend Validation (Node.js 20)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check API Schema Freshness
        working-directory: frontend
        run: npm run check:api

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run Prettier Check
        working-directory: frontend
        run: npm run format:check

      - name: Run TypeScript Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run Vitest Unit & Integration Tests
        working-directory: frontend
        run: npm test

      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Container Build Validation
    needs: [backend-lint-and-test, frontend-lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Compose Images
        run: docker compose build

