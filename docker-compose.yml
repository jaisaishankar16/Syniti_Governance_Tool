version: "3.9"

services:
  # ----------------------------------------------------------------------------
  # Redis Cache & Distributed Lock Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: syniti-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-syniti_dev_secret}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-syniti_dev_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # FastAPI Analysis Orchestrator Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syniti-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_URL=redis://:${REDIS_PASSWORD:-syniti_dev_secret}@redis:6379/0
      - CACHE_BACKEND=auto
      - RATE_LIMIT_BACKEND=redis
      - DOCS_ENABLED=true
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - knowledge_indexes:/app/knowledge/index
      - learned_knowledge:/app/knowledge/learned
      - backend_logs:/app/logs
      - activity_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Vite + React Frontend SPA Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syniti-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  knowledge_indexes:
    name: syniti_knowledge_indexes
  redis_data:
    name: syniti_redis_data
  learned_knowledge:
    name: syniti_learned_knowledge
  backend_logs:
    name: syniti_backend_logs
  activity_data:
    name: syniti_activity_data

